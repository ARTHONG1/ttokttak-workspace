<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f4f7" />
    <title>로그인 — 똑딱작업실</title>
    <link rel="icon" href="/__web/icon.png" />
    <link rel="stylesheet" href="/__web/login.css" />
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/__web/icon.png" alt="" width="56" height="56" />
      <h1>똑딱작업실 체험하기</h1>
      <p class="lead">Google 계정으로 로그인하면 바로 시작할 수 있어요.</p>
      <button id="google" type="button" class="google" disabled>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z" />
          <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z" />
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z" />
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z" />
        </svg>
        <span>Google 계정으로 계속하기</span>
      </button>
      <p id="msg" class="msg" role="status" aria-live="polite">준비하는 중…</p>
      <p class="fine">로그인 정보는 계정마다 AI 사용량을 세는 데에만 씁니다.</p>
      <a class="back" href="/">소개 페이지로 돌아가기</a>
    </main>
    <script type="module" src="/__web/login.js"></script>
  </body>
</html>
