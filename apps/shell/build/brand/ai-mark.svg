<!--
  똑딱작업실 AI button mark (reference drawing).

  A rounded-square speech bubble holding a four-point sparkle: "the
  assistant you talk to". Single colour, drawn with `currentColor` so it
  follows the surrounding text colour in both themes.

  The bubble geometry is adapted from the Lucide icon `message-square`
  (ISC License, https://lucide.dev); see NOTICE.

  The shipping copy is the React component packages/ui/src/AiMark.tsx, which
  inlines the same two shapes. Keep the two files in sync by hand.
-->
