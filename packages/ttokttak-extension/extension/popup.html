<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>똑딱작업실</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px 18px 18px;
        font:
          13px/1.55 'Pretendard',
          'Apple SD Gothic Neo',
          'Malgun Gothic',
          sans-serif;
        color: #1d2433;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }
      h2 {
        margin: 14px 0 0;
        font-size: 14px;
      }
      .sub {
        color: #667085;
        font-weight: 400;
        font-size: 12px;
      }
      .ready {
        background: #ecfdf3;
        color: #067647;
        border-radius: 8px;
        padding: 8px 10px;
        font-weight: 700;
      }
      ol {
        margin: 12px 0 0;
        padding-left: 20px;
      }
      li {
        margin: 6px 0;
      }
      b {
        color: #2f6bff;
      }
      .waiting {
        margin-top: 12px;
        background: #f5f8ff;
        border-radius: 8px;
        padding: 8px 10px;
      }
      .foot {
        margin-top: 12px;
      }
      .place {
        display: block;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>똑딱작업실 <span id="version" class="sub"></span></h1>
    <p class="ready">✓ 준비됐어요. 따로 설정할 것은 없어요.</p>
    <div id="features"></div>
    <p id="place" class="sub"></p>
    <p class="sub foot">저장·결재·제출은 채운 뒤 선생님이 직접 눌러요.</p>
    <script src="popup.js"></script>
  </body>
</html>
