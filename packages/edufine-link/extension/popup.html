<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>똑딱 에듀파인 연결</title>
    <style>
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font:
          13px 'Apple SD Gothic Neo',
          'Malgun Gothic',
          sans-serif;
        color: #1d2433;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 2px;
      }
      h2 {
        font-size: 13px;
        margin: 14px 0 6px;
      }
      .sub {
        color: #667085;
        margin: 0;
      }
      input[type='text'] {
        width: 100%;
        box-sizing: border-box;
        padding: 7px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
      }
      button {
        border: 1px solid #d0d5dd;
        background: #fff;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      .primary {
        background: #2f6bff;
        color: #fff;
        border-color: #2f6bff;
      }
      ul {
        padding-left: 16px;
        margin: 6px 0;
      }
      .msg {
        margin: 6px 0 0;
      }
      .ok {
        color: #067647;
      }
      .bad {
        color: #b42318;
      }
      .row {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <h1>똑딱 에듀파인 연결 <span id="version" class="sub"></span></h1>
    <p class="sub">
      K-에듀파인 화면 오른쪽 아래 [똑딱] 버튼에서 품의를 넣어요. 저장·결재는 선생님이 직접 해요.
    </p>

    <h2>1. K-에듀파인 주소</h2>
    <input id="origin" type="text" placeholder="예: klef.○○○.go.kr" aria-label="K-에듀파인 주소" />
    <div class="row"><button id="allow" class="primary" type="button">허용</button></div>
    <p id="origin-msg" class="msg"></p>
    <ul id="origins"></ul>

    <h2>2. 실제로 채우기</h2>
    <label><input id="fill" type="checkbox" /> 미리보기를 확인한 뒤 [채우기]로 화면에 넣기</label>
    <p id="fill-msg" class="msg sub">꺼져 있으면 미리보기만 보여 줘요.</p>

    <h2>3. 연결 상태</h2>
    <p>똑딱작업실 프로그램: <span id="desktop">확인 중…</span></p>
    <p>똑딱작업실 웹 앱: <span id="web">확인 중…</span></p>

    <h2>4. 화면 이름표</h2>
    <p>지금 쓰는 표: <span id="map"></span></p>
    <div class="row">
      <button id="map-refresh" type="button">웹 앱에서 새로 받기</button>
      <button id="map-file-pick" type="button">파일 넣기</button>
      <button id="map-reset" type="button">기본값</button>
      <input id="map-file" type="file" accept=".json" hidden />
    </div>
    <p id="map-msg" class="msg"></p>
    <script src="popup.js"></script>
  </body>
</html>
