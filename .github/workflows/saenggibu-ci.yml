name: 똑딱생기부 CI

# 똑딱생기부 (apps/saenggibu) is a standalone app with its own checks: typecheck and its unit
# tests, including 나이스로 보내기 in a real Chromium against a fake NEIS grid. It runs only
# when the app's folder changes; 똑딱작업실's CI does not include it.

on:
  push:
    branches: [main]
    paths:
      - apps/saenggibu/**
      - .github/workflows/saenggibu-ci.yml
  pull_request:
    branches: [main]
    paths:
      - apps/saenggibu/**
      - .github/workflows/saenggibu-ci.yml
  workflow_dispatch:

concurrency:
  group: saenggibu-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @ttokttak/saenggibu

      - name: Unit tests
        run: npm run test -w @ttokttak/saenggibu
