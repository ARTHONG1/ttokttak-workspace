name: E2E (Electron)

# The Electron end-to-end suite (e2e/*.spec.ts) plus the Markdown browser
# tests. It runs one test at a time and takes over an hour, so it is not part
# of the per-push gate (ci.yml): it runs nightly on main and on demand from the
# Actions tab. It uses no repository secret.

on:
  schedule:
    - cron: '30 17 * * *' # 02:30 KST
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    # 22.04, not -latest: 24.04's AppArmor hardening blocks Electron renderer
    # spawn under xvfb even with --no-sandbox and the userns sysctl lifted
    runs-on: ubuntu-22.04
    # The full serial Electron suite outgrew the 60 minutes it had inside
    # ci.yml and was cut off on every push, so its failures were never
    # reported. Here it has room to finish. Individual test timeouts stay
    # unchanged.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (xlsx-sidecar)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/sheets/native/xlsx-engine

      # electron's postinstall downloads its binary from GitHub Releases on every
      # fresh install; a cache hit skips the download (and its 5xx flakes)
      - name: Cache electron binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          # own prefix: the build workflows' electron-* entries also hold
          # ~/.cache/electron-builder, and a saved key is never updated
          key: electron-bin-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-bin-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build apps
        run: npm run build:all

      - name: Generate sheets fixtures
        run: npm run fixtures -w @genoffice/sheets

      # Newer Ubuntu kernels ship an AppArmor policy that blocks unprivileged
      # user namespaces, which kills the Chromium zygote even with --no-sandbox
      # (window opens, renderer never loads). The knob only exists on kernels
      # that enforce the restriction, so skip it where it is absent instead of
      # failing the job (22.04 runner images vary by kernel).
      - name: Allow unprivileged user namespaces (Electron)
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      # Pixel baselines (docs-visual.spec.ts) depend on the font stack: pin
      # Calibri/Cambria metric-compatible faces and CJK glyphs so renders are
      # reproducible across runner images and contributor machines.
      - name: Install document fonts (visual baselines)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-crosextra-carlito fonts-crosextra-caladea fonts-noto-cjk

      # CSS layout tests use standalone Chromium in addition to Electron.
      # Keep the pinned document font stack unchanged: --with-deps adds fonts
      # that alter the existing pixel baselines. Electron already supplies the
      # required system libraries on this runner.
      - name: Install Chromium for layout tests
        run: npx playwright install chromium

      - name: Markdown browser tests
        run: npx playwright test --config apps/markdown/playwright.config.ts

      # Electron needs a display server on Linux runners. DEBUG=pw:browser
      # forwards the Electron process stdout/stderr into the CI log so launch
      # failures are diagnosable.
      - name: E2E (Electron shell)
        env:
          DEBUG: 'pw:browser'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            e2e/test-results
          retention-days: 7
